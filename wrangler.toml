name = "partnerfind-cloudflare"
main = "worker/index.ts"
compatibility_date = "2026-10-30"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "partnerfind-db"
database_id = "fe636fea-3cd8-4405-ba2d-1d1aaff405a4"
migrations_dir = "worker/migrations"

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true
